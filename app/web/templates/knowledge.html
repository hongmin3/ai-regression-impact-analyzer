{% extends "base.html" %}{% block content %}<div class="grid"><section><h2>사양서 / Manual 등록</h2><form method="post" action="/knowledge/specification" enctype="multipart/form-data"><label>제품명<input name="product" required></label><label>Version<input name="version"></label><label>Revision<input name="revision"></label><label>PDF<input type="file" name="file" accept=".pdf" required></label><button>등록</button></form><ul>{% for i in specs %}<li>{{ i.product }} · {{ i.version }} · {{ i.name }}</li>{% endfor %}</ul></section><section><h2>Test Case 등록</h2><form method="post" action="/knowledge/testcase" enctype="multipart/form-data"><label>제품명<input name="product" required></label><label>Version<input name="version"></label><label>TC Set Name<input name="revision"></label><label>XLSX<input type="file" name="file" accept=".xlsx" required></label><button>등록</button></form><ul>{% for i in testcases %}<li>{{ i.product }} · {{ i.version }} · {{ i.name }}</li>{% endfor %}</ul></section></div>{% endblock %}
