{% extends "base.html" %}
{% block content %}
<section>
  <h2>Regression 분석</h2>
  <div id="keystatus" class="keystatus">
    <span>Gemini Key 상태 확인 중...</span>
    <button type="button" id="keyreload">설정 다시 읽기</button>
  </div>
  <form id="analysis-form">
    <label>변경사항 PDF 또는 Word (.docx)<input type="file" name="change_file" accept=".pdf,.docx" required></label>
    <label>사양서<select name="specification_id" required><option value="">선택</option>{% for item in specs %}<option value="{{ item.id }}">{{ item.product }} / {{ item.name }}</option>{% endfor %}</select></label>
    <label>Test Case Excel<select name="testcase_id" required><option value="">선택</option>{% for item in testcases %}<option value="{{ item.id }}">{{ item.product }} / {{ item.name }}</option>{% endfor %}</select></label>
    <button>분석 실행</button>
  </form>
  <div id="status" class="status">사양서와 TC를 Knowledge 메뉴에서 먼저 등록하세요.</div>
</section>
<script>
const f=document.querySelector('#analysis-form'),s=document.querySelector('#status');
f.addEventListener('submit',async e=>{e.preventDefault();s.textContent='업로드 중...';const r=await fetch('/analyses',{method:'POST',body:new FormData(f)});const d=await r.json();if(!r.ok){s.textContent=d.detail||'실패';return}const timer=setInterval(async()=>{const q=await(await fetch(d.status_url)).json();s.textContent='상태: '+q.status;if(q.status==='DONE'){clearInterval(timer);const id=q.result.analysis_id;s.innerHTML=`완료 · 추천 ${q.result.decisions.filter(x=>x.recommended).length}건 · <a href="/reports/regression-${id}.html" target="_blank">HTML Report</a> · <a href="/exports/regression-${id}.csv">CSV Export</a>`}if(q.status==='FAILED'){clearInterval(timer);s.textContent='실패: '+q.error}},1200)});
</script>
<script>
const kb=document.querySelector('#keystatus'),kt=kb.querySelector('span');
async function loadKey(reload){kt.textContent='Gemini Key 상태 확인 중...';try{const r=await fetch(reload?'/config/reload':'/config/status',{method:reload?'POST':'GET'});const d=await r.json();const k=d.gemini_api_key;kb.classList.toggle('missing',!k.configured);kt.innerHTML=k.configured?`Gemini API Key 설정됨 · 출처 <code>${k.source}</code> · 길이 ${k.length}자 · 모델 <code>${d.gemini_model.value}</code>`:'Gemini API Key가 없습니다. 프로젝트 폴더의 <code>secrets.txt</code>를 메모장으로 열어 <code>GEMINI_API_KEY=</code> 뒤에 Key를 붙여넣고 저장한 뒤 이 버튼을 누르세요.'}catch(e){kb.classList.add('missing');kt.textContent='Key 상태를 확인하지 못했습니다.'}}
document.querySelector('#keyreload').addEventListener('click',()=>loadKey(true));loadKey(false);
</script>
{% endblock %}
