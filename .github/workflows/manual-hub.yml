# 하위 서비스 CI — services/qa-manual-hub
#
# 핵심 앱과 런타임이 완전히 다르다(PostgreSQL, Node). 그래서 워크플로를 따로 두고
# services/qa-manual-hub/** 가 바뀔 때만 돌린다. 핵심 앱만 수정하면 이 워크플로는
# 아예 실행되지 않는다.
name: Manual Hub CI

on:
  push:
    paths:
      - "services/qa-manual-hub/**"
      - ".github/workflows/manual-hub.yml"
  pull_request:
    paths:
      - "services/qa-manual-hub/**"
      - ".github/workflows/manual-hub.yml"

defaults:
  run:
    working-directory: services/qa-manual-hub

jobs:
  backend:
    name: backend pytest (PostgreSQL)
    runs-on: ubuntu-latest
    # JSONB, lower(...) 함수 유니크 인덱스, SELECT ... FOR UPDATE 를 실제로 쓰므로
    # SQLite 로는 검증되지 않는다. 진짜 PostgreSQL 이 필요하다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qamanual
          POSTGRES_PASSWORD: qamanual
          POSTGRES_DB: qa_manual_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://qamanual:qamanual@127.0.0.1:5432/qa_manual_hub_test
      # app/main.py 는 import 시점에 저장소 루트를 만들어 본다. 기본값 /srv/qa-manual-hub 는
      # CI 러너가 만들 수 없으므로(권한 없음) 러너가 쓸 수 있는 경로를 미리 지정한다.
      # 테스트 본체는 conftest 의 tmp_path 로 다시 덮어쓴다.
      STORAGE_ROOT: ${{ runner.temp }}/qamh-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/qa-manual-hub/backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: services/qa-manual-hub/backend

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/qa-manual-hub/frontend/package-lock.json
      - run: npm ci
        working-directory: services/qa-manual-hub/frontend
      # 단독 배포용 빌드와 플랫폼(/manual-hub/) 서브패스 빌드를 둘 다 검증한다.
      # 한쪽만 깨지는 회귀를 CI 에서 잡기 위해서다.
      - run: npm run build
        working-directory: services/qa-manual-hub/frontend
      - run: npm run build:platform
        working-directory: services/qa-manual-hub/frontend
      - name: 서브패스 빌드 산출물 검증
        working-directory: services/qa-manual-hub/frontend
        run: |
          grep -q '"/manual-hub/assets/' dist/index.html \
            || (echo "platform 빌드가 /manual-hub/ base 를 반영하지 않았습니다"; exit 1)
